# Render Blueprint — Ramnagar Eats API
#
# How to deploy:
#   1. Push this repo to GitHub.
#   2. In Render: New + -> Blueprint -> pick this repo.
#   3. Render prompts for the env vars marked "sync: false" below
#      (MONGODB_URI, JWT_SECRET, CORS_ORIGINS, SMTP/email, Google OAuth...).
#
# CRITICAL: "sync: false" vars are NEVER auto-provisioned — they must be
# entered in the dashboard (Service -> Environment). JWT_SECRET is REQUIRED:
# the API refuses to boot without it in production ("JWT_SECRET must be
# configured in production"). Generate one with:
#   node -e "console.log(require('crypto').randomBytes(48).toString('hex'))"
#
# The service area (SERVICE_CENTER_*, SERVICE_RADIUS_KM) is intentionally NOT
# in the Render env: the runtime reads the delivery area from MongoDB
# (admin-editable) and the code defaults are Ramnagar, Jammu. See docs/PROJECT.md.
#
# Render caps env vars at 20 per service. Vars with code defaults (BRAND_NAME,
# CURRENCY_SYMBOL, ORDER_PREFIX, PHONE_COUNTRY_CODE, BASE_DELIVERY_FEE,
# DELIVERY_FEE_FREE_ABOVE, OTP_DELIVERY, SMTP_PORT) are intentionally omitted
# here — the code falls back to sensible defaults automatically.

services:
  - type: web
    name: ramnagar-eats-api
    runtime: node
    rootDir: backend
    # --include=dev: Render injects NODE_ENV=production into the build, which
    # makes plain `npm ci` skip devDependencies (the @types/* needed by tsc).
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAPBOX_ACCESS_TOKEN
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: PUBLIC_API_URL
        sync: false
      - key: CUSTOMER_WEB_URL
        sync: false
      - key: RESTAURANT_WEB_URL
        sync: false
      - key: IMAGEKIT_PUBLIC_KEY
        sync: false
      - key: IMAGEKIT_PRIVATE_KEY
        sync: false
      - key: IMAGEKIT_URL_ENDPOINT
        sync: false
