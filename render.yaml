# Render Blueprint — Ramnagar Eats API
#
# How to deploy:
#   1. Push this repo to GitHub.
#   2. In Render: New + -> Blueprint -> pick this repo.
#   3. Render prompts for the env vars marked "sync: false" below
#      (MONGODB_URI, JWT_SECRET, CORS_ORIGINS, SMTP/email, Google OAuth...).
# See docs/DEPLOYMENT.md for the full cutover checklist.

services:
  - type: web
    name: ramnagar-eats-api
    runtime: node
    rootDir: backend
    # --include=dev: Render injects NODE_ENV=production into the build, which
    # makes plain `npm ci` skip devDependencies (the @types/* needed by tsc).
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: OTP_DELIVERY
        value: smtp
      - key: EMAIL_FROM
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAPBOX_ACCESS_TOKEN
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: PUBLIC_API_URL
        sync: false
      - key: CUSTOMER_WEB_URL
        sync: false
      - key: RESTAURANT_WEB_URL
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: IMAGEKIT_PUBLIC_KEY
        sync: false
      - key: IMAGEKIT_PRIVATE_KEY
        sync: false
      - key: IMAGEKIT_URL_ENDPOINT
        sync: false
      - key: SERVICE_CENTER_LAT
        value: "19.076"
      - key: SERVICE_CENTER_LNG
        value: "72.8777"
      - key: SERVICE_RADIUS_KM
        value: "5"
      - key: BRAND_NAME
        value: Ramnagar Eats
      - key: CURRENCY_SYMBOL
        value: "₹"
      - key: ORDER_PREFIX
        value: RE-
      - key: PHONE_COUNTRY_CODE
        value: "91"
      - key: BASE_DELIVERY_FEE
        value: "20"
      - key: DELIVERY_FEE_FREE_ABOVE
        value: "499"
