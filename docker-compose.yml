services:
  mongodb:
    image: mongo:8
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      # Set MONGODB_URI in .env.production to use MongoDB Atlas; defaults to the bundled Mongo.
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017/ramnagar-eats}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in production}
      SERVICE_CENTER_LAT: ${SERVICE_CENTER_LAT:-32.80674}
      SERVICE_CENTER_LNG: ${SERVICE_CENTER_LNG:-75.314854}
      SERVICE_RADIUS_KM: ${SERVICE_RADIUS_KM:-15}
      BASE_DELIVERY_FEE: ${BASE_DELIVERY_FEE:-20}
      DELIVERY_FEE_FREE_ABOVE: ${DELIVERY_FEE_FREE_ABOVE:-499}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-300}
      AUTH_RATE_LIMIT_WINDOW_MS: ${AUTH_RATE_LIMIT_WINDOW_MS:-60000}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-10}
      # Branding
      BRAND_NAME: ${BRAND_NAME:-Ramnagar Eats}
      CURRENCY_SYMBOL: ${CURRENCY_SYMBOL:-₹}
      ORDER_PREFIX: ${ORDER_PREFIX:-RE-}
      PHONE_COUNTRY_CODE: ${PHONE_COUNTRY_CODE:-91}
      # Email (Brevo SMTP relay or REST API)
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      OTP_DELIVERY: ${OTP_DELIVERY:-}
      OTP_TTL_MS: ${OTP_TTL_MS:-300000}
      OTP_MAX_ATTEMPTS: ${OTP_MAX_ATTEMPTS:-5}
      OTP_RESEND_COOLDOWN_MS: ${OTP_RESEND_COOLDOWN_MS:-60000}
      # Google OAuth
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-}
      CUSTOMER_WEB_URL: ${CUSTOMER_WEB_URL:-}
      RESTAURANT_WEB_URL: ${RESTAURANT_WEB_URL:-}
      # ImageKit CDN
      IMAGEKIT_PUBLIC_KEY: ${IMAGEKIT_PUBLIC_KEY:-}
      IMAGEKIT_PRIVATE_KEY: ${IMAGEKIT_PRIVATE_KEY:-}
      IMAGEKIT_URL_ENDPOINT: ${IMAGEKIT_URL_ENDPOINT:-}
    ports:
      - "5000:5000"
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  # One-shot database seed (demo accounts, restaurants, menu, coupons).
  # Run manually on a fresh deployment: docker compose up seed
  seed:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      NODE_ENV: production
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017/ramnagar-eats}
      SERVICE_CENTER_LAT: ${SERVICE_CENTER_LAT:-32.80674}
      SERVICE_CENTER_LNG: ${SERVICE_CENTER_LNG:-75.314854}
      SERVICE_RADIUS_KM: ${SERVICE_RADIUS_KM:-15}
    command: ["node", "dist/seed.js"]
    depends_on:
      mongodb:
        condition: service_healthy
    restart: "no"

  customer-web:
    build:
      context: .
      dockerfile: docker/customer.Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api/v1}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL:-http://localhost:5000}
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 5

  restaurant-web:
    build:
      context: .
      dockerfile: docker/restaurant.Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api/v1}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL:-http://localhost:5000}
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  mongo-data:
