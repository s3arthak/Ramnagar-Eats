services:
  mongodb:
    image: mongo:8
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/ramnagar-eats
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in production}
      SERVICE_CENTER_LAT: ${SERVICE_CENTER_LAT:-19.076}
      SERVICE_CENTER_LNG: ${SERVICE_CENTER_LNG:-72.8777}
      SERVICE_RADIUS_KM: ${SERVICE_RADIUS_KM:-5}
      BASE_DELIVERY_FEE: ${BASE_DELIVERY_FEE:-20}
      DELIVERY_FEE_FREE_ABOVE: ${DELIVERY_FEE_FREE_ABOVE:-499}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-300}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-10}
    ports:
      - "5000:5000"
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  # One-shot database seed (demo accounts, restaurants, menu, coupons).
  # Run manually on a fresh deployment: docker compose up seed
  seed:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017/ramnagar-eats
      SERVICE_CENTER_LAT: ${SERVICE_CENTER_LAT:-19.076}
      SERVICE_CENTER_LNG: ${SERVICE_CENTER_LNG:-72.8777}
      SERVICE_RADIUS_KM: ${SERVICE_RADIUS_KM:-5}
    command: ["node", "dist/seed.js"]
    depends_on:
      mongodb:
        condition: service_healthy
    restart: "no"

  customer-web:
    build:
      context: .
      dockerfile: docker/customer.Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api/v1}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL:-http://localhost:5000}
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 5

  restaurant-web:
    build:
      context: .
      dockerfile: docker/restaurant.Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api/v1}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL:-http://localhost:5000}
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  mongo-data:
