<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 64">
  <defs>
    <linearGradient id="logo-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF6B00"/>
      <stop offset="100%" stop-color="#FF8C00"/>
    </linearGradient>
    <linearGradient id="r-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF8C00"/>
      <stop offset="100%" stop-color="#FF6B00"/>
    </linearGradient>
  </defs>
  
  <!-- Brand text - RAMNAGAR -->
  <text x="60" y="28" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="26" fill="#2A0E08" letter-spacing="-0.5">
    RAMNAGAR
  </text>
  
  <!-- Stylized R logo (like Swiggy's S) -->
  <g transform="translate(8, 18)">
    <!-- R letter with orange gradient -->
    <path d="M4 8 C4 4, 8 2, 14 2 C22 2, 24 8, 24 8 L24 18 C24 20, 22 22, 18 22 C16 22, 15 21, 15 20 L15 12 L10 12 L10 20 C10 21, 9 22, 7 22 C3 22, 2 20, 2 18 Z" 
          fill="url(#r-grad)" stroke="#E05500" stroke-width="0.5"/>
    <!-- R leg -->
    <path d="M18 22 L18 32 L14 32 L14 24" fill="url(#r-grad)" stroke="#E05500" stroke-width="0.5"/>
  </g>
  
  <!-- EATS text in orange -->
  <text x="60" y="50" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="18" fill="#FF6B00" letter-spacing="-0.3">
    EATS
  </text>
  
  <!-- Subtle background -->
  <rect x="0" y="0" width="200" height="64" rx="12" fill="url(#logo-bg)" opacity="0.1"/>
</svg>
