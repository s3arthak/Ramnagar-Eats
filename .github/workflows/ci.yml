name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Typecheck, build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck backend
        run: npm run typecheck --workspace=backend

      - name: Build all workspaces (includes web app typechecks)
        run: npm run build

      - name: Run API test suite (in-memory MongoDB)
        run: npm run test:api --workspace=backend
