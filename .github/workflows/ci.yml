name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Typecheck, build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck backend
        run: npm run typecheck --workspace=backend

      - name: Build all workspaces (includes web app typechecks)
        run: npm run build

      - name: Run API test suite (in-memory MongoDB)
        run: npm run test:api --workspace=backend

  docker:
    name: Production Docker stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and boot the production stack
        run: docker compose up --build -d
        env:
          JWT_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef

      - name: Wait for the API to report healthy
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5000/api/v1/health >/dev/null 2>&1; then
              echo "API healthy after ~$((i * 2))s"
              break
            fi
            sleep 2
          done
          curl -sf http://localhost:5000/api/v1/health

      - name: Verify both web apps are served by nginx
        run: |
          curl -sf http://localhost:3000/ -o /dev/null && echo "customer app OK"
          curl -sf http://localhost:3001/ -o /dev/null && echo "restaurant app OK"

      - name: Smoke-test the API
        run: |
          curl -sf "http://localhost:5000/api/v1/restaurants?lat=32.80674&lng=75.314854" -o /dev/null && echo "API responds"

      - name: Tear down the stack
        if: always()
        run: docker compose down -v
        env:
          JWT_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
